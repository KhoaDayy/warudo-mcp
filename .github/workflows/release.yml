name: Release
# Manual fallback. Normal releases come from release-please.yml.
# Run it against an existing tag (Actions > Release > Run workflow > pick the tag
# as the ref), for example to retry a failed npm publish. It re-checks that the
# tag matches mcp-server/package.json, creates the GitHub Release only if it is
# missing, and publishes to npm when the NPM_TOKEN secret is set.
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Check tag matches package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "Tag $GITHUB_REF != package version v$v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:install
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npm pack --pack-destination "$RUNNER_TEMP/out"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          files=("$RUNNER_TEMP"/out/*.tgz)
          [ -f warudo-plugin/Warudo-MCP.warudo ] && files+=(warudo-plugin/Warudo-MCP.warudo)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
          fi
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
